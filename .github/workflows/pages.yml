name: Pages

# 榜单页从**入库的官方产物**（bench/results/v2）现算生成——
# 页面上的每个数字都能在仓库里追到原始产物，不存在手工维护的副本。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build leaderboard page
        run: |
          mkdir -p _site
          python3 -m bench.report.html bench/results/v2 --write _site/index.html
          touch _site/.nojekyll
      - name: Sanity — page has the charts and tables
        run: python3 tests/test_report_html.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
